name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Formatting (treefmt)
        run: devenv shell -- treefmt --ci
      - name: Validate the Renovate preset
        run: devenv shell -- renovate-config-validator default.json .github/renovate.json
      - name: actionlint
        run: devenv shell -- actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv shell -- zizmor --format=github .github/workflows

  # Single required status check for the branch ruleset.
  final-check:
    if: always()
    needs: [lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = success
